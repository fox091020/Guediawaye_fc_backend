spring.application.name=gfc-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gfcdb}
spring.datasource.username=${DB_USER:gfc}
spring.datasource.password=${DB_PASSWORD:votre-mot-de-passe}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.media.storage-dir=${MEDIA_STORAGE_DIR:./uploads}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
app.media.max-file-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.auth.developer-initial-password=${GFC_DEVELOPER_INITIAL_PASSWORD:}
app.frontend-origins=${GFC_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=GFCSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}


